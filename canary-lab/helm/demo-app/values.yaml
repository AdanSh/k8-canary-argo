replicaCount: 5
revisionHistoryLimit: 3

image:
  repository: argoproj/rollouts-demo
  # Changing the tag is a new version: it starts the canary steps below
  tag: blue
  pullPolicy: IfNotPresent

containerPort: 8080

readinessProbe:
  httpGet:
    path: /color
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5

resources:
  requests:
    cpu: 5m
    memory: 32Mi

service:
  port: 80

ingress:
  className: nginx
  host: demo.local
  path: /
  pathType: Prefix

canary:
  # Argo prefixes these with nginx.ingress.kubernetes.io/ on the canary Ingress it creates
  additionalIngressAnnotations:
    canary-by-header: X-Canary
    canary-by-header-value: "true"
    canary-by-cookie: canary
  # Timed pauses: the rollout promotes itself unless analysis fails.
  # Use pause: {} for a manual gate (kubectl argo rollouts promote <release>).
  steps:
    - setWeight: 20
    - pause: {duration: 1m}
    - setWeight: 50
    - pause: {duration: 1m}
    - setWeight: 100
  # Seconds the old ReplicaSet stays up after promotion
  scaleDownDelaySeconds: 30
  # true: scale stable down as canary scales up (fewer pods, slower abort)
  dynamicStableScale: false

# Background smoke test: from startingStep until the rollout finishes, a Job
# curls the canary Service every interval. failureLimit failures abort the rollout.
analysis:
  enabled: true
  startingStep: 1          # index into steps: start once the canary has traffic
  image: curlimages/curl:8.11.1
  path: /color             # set to a missing path (e.g. /broken) to see an auto-abort
  interval: 10s
  failureLimit: 1

# Abort automatically if the canary can't become ready in time (e.g. a bad image tag)
progressDeadlineSeconds: 120
progressDeadlineAbort: true
